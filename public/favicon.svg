<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Raphaël Onana">
  <!-- Light browser theme: dark plate, white R. Dark browser theme: soft silver plate, black R. -->
  <defs>
    <linearGradient id="plate-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="plate-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4e6ec"/>
      <stop offset="100%" stop-color="#aeafbd"/>
    </linearGradient>
  </defs>
  <style>
    .plate { fill: url(#plate-light); }
    .edge { stroke: rgba(255, 255, 255, 0.12); }
    .mark { stroke: #ffffff; }
    .dot { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: url(#plate-dark); }
      .edge { stroke: rgba(255, 255, 255, 0.35); }
      .mark { stroke: #0b0d14; }
      .dot { fill: #0b0d14; }
    }
  </style>

  <rect class="plate" x="1.5" y="1.5" width="37" height="37" rx="10"/>
  <rect class="edge" x="1.5" y="1.5" width="37" height="37" rx="10" fill="none" stroke-width="0.8"/>

  <!-- Geometric "R": top arch + diagonal leg -->
  <g class="mark" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 12 H22 a5 5 0 0 1 0 10 H13"/>
    <path d="M18 22 L27 28"/>
  </g>

  <circle class="dot" cx="30" cy="10" r="2"/>
</svg>
